[project]
name = "99-bottles-of-beer-python-kata"
version = "1.0.0"
description = "99-bottles-of-beer for Python katas"
authors = [{ name = "Codding Cuddles" }]
requires-python = ">=3.11"

dependencies = [
    "pytest>=9.1.1"
]

[dependency-groups]
dev = [
    "ruff>=0.16.1"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
